<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IELTS Prep — подготовка к экзамену</title>
  <meta name="description" content="Бесплатная подготовка к IELTS: Reading, Listening в формате экзамена, Writing, Speaking, тренажёр слов и калькулятор баллов.">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <script>
    // Тему применяем до загрузки стилей, чтобы страница не мигала.
    try {
      var t = JSON.parse(localStorage.getItem("ielts:theme"));
      if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css?v=3">
  <!-- Шрифты грузятся без блокировки отрисовки; пока их нет, показывается системный шрифт (font-display: swap). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Manrope:wght@700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Manrope:wght@700;800&display=swap"></noscript>
  <script src="js/core.js?v=3" defer></script>
</head>
<body>
  <a class="skip-link" href="#app">Перейти к содержимому</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#home" class="logo"><span class="logo-mark" aria-hidden="true">I</span><span>IELTS <b>Prep</b></span><span class="sr-only">— на главную</span></a>
      <nav id="nav" aria-label="Разделы сайта">
        <a href="#home" data-route="home">Главная</a>
        <a href="#reading" data-route="reading">Reading</a>
        <a href="#listening" data-route="listening">Listening</a>
        <a href="#writing" data-route="writing">Writing</a>
        <a href="#speaking" data-route="speaking">Speaking</a>
        <a href="#vocab" data-route="vocab">Словарь</a>
        <a href="#calc" data-route="calc">Калькулятор</a>
      </nav>
      <div class="topbar-actions">
        <button class="icon-toggle" id="themeBtn" type="button" aria-label="Сменить тему"><span aria-hidden="true">🌙</span></button>
        <button class="icon-toggle menu-btn" id="menuBtn" type="button" aria-label="Меню" aria-expanded="false" aria-controls="nav">
          <span class="burger" aria-hidden="true"><span></span><span></span><span></span></span>
        </button>
      </div>
    </div>
  </header>
  <div class="nav-backdrop" id="navBackdrop"></div>

  </footer>
</body>
</html>
