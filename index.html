<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IELTS Prep — подготовка к экзамену</title>
  <meta name="description" content="Бесплатная подготовка к IELTS: Reading, Listening, Writing, Speaking, тренажёр слов и калькулятор баллов.">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <script>
    // Тему применяем до загрузки стилей, чтобы страница не мигала.
    try {
      var t = JSON.parse(localStorage.getItem("ielts:theme"));
      if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#home" class="logo"><span class="logo-mark">I</span>IELTS<span>Prep</span></a>
      <nav id="nav" aria-label="Разделы">
        <a href="#home" data-route="home">Главная</a>
        <a href="#reading" data-route="reading">Reading</a>
        <a href="#listening" data-route="listening">Listening</a>
        <a href="#writing" data-route="writing">Writing</a>
        <a href="#speaking" data-route="speaking">Speaking</a>
        <a href="#vocab" data-route="vocab">Словарь</a>
        <a href="#calc" data-route="calc">Калькулятор</a>
      </nav>
      <div class="topbar-actions">
        <button class="icon-toggle" id="themeBtn" aria-label="Сменить тему">🌙</button>
        <button class="icon-toggle menu-btn" id="menuBtn" aria-label="Меню" aria-expanded="false" aria-controls="nav">
          <span class="burger"><span></span><span></span><span></span></span>
        </button>
      </div>
    </div>
  </header>
  <div class="nav-backdrop" id="navBackdrop"></div>

  <main id="app"></main>

  <footer class="footer">
    Прогресс сохраняется в вашем браузере. IELTS — зарегистрированная торговая марка British Council, IDP и Cambridge; сайт не связан с ними.
  </footer>

  <script src="js/data.js"></script>
  <script src="js/words.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
